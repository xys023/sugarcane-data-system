<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>甘蔗田间数据收集系统 - 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 登录页面 -->
  <div id="login-page" class="login-page">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">🌿</div>
        <h1>甘蔗田间数据收集系统</h1>
        <p>管理后台</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="login-username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
        <p class="login-tip">默认管理员账号：admin / admin123</p>
      </form>
    </div>
  </div>

  <!-- 主应用界面 -->
  <div id="app" class="app-container" style="display:none;">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">🌿</span>
        <span class="sidebar-title">甘蔗数据系统</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span>
          <span class="nav-text">数据概览</span>
        </a>
        <a href="#" class="nav-item" data-page="plots">
          <span class="nav-icon">🏞️</span>
          <span class="nav-text">试验田管理</span>
        </a>
        <a href="#" class="nav-item" data-page="plants">
          <span class="nav-icon">🌱</span>
          <span class="nav-text">植株管理</span>
        </a>
        <a href="#" class="nav-item" data-page="growth">
          <span class="nav-icon">📈</span>
          <span class="nav-text">生长记录</span>
        </a>
        <a href="#" class="nav-item" data-page="diseases">
          <span class="nav-icon">🦠</span>
          <span class="nav-text">病害记录</span>
        </a>
        <a href="#" class="nav-item" data-page="export">
          <span class="nav-icon">📥</span>
          <span class="nav-text">数据导出</span>
        </a>
        <a href="#" class="nav-item admin-only" data-page="users" style="display:none;">
          <span class="nav-icon">👥</span>
          <span class="nav-text">用户管理</span>
        </a>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="page-title">数据概览</h2>
        </div>
        <div class="topbar-right">
          <span class="user-info" id="user-info">管理员</span>
          <button class="btn btn-text" onclick="logout()">退出登录</button>
        </div>
      </header>

      <!-- 页面内容容器 -->
      <div class="page-content" id="page-content">
        <!-- 动态加载页面内容 -->
      </div>
    </main>
  </div>

  <!-- 模态框容器 -->
  <div id="modal-container"></div>

  <!-- 消息提示容器 -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/plots.js"></script>
  <script src="js/plants.js"></script>
  <script src="js/growth.js"></script>
  <script src="js/diseases.js"></script>
  <script src="js/export.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
